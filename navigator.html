<style>
:root{

  --blue:#3b6eff; --blue-soft:#182252; --blue-text:#7ea0ff; --blue-bright:#9db8ff;
  --yellow:#ffcf40; --green:#3fbf87; --green-text:#6fd7ab; --red:#ff6b6b;
  --text:#eef1fb; --muted:#8791b3; --muted2:#7a84a8;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased}
a{color:var(--blue-text); text-decoration:none}

button,select,input{font-family:inherit}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px}
header{border-bottom:1px solid var(--border); background:var(--bg2)}

.lang{display:flex; gap:4px}
.lang button{background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:4px 10px; font-size:13px; cursor:pointer; min-height:32px}
.lang button.on{border-color:var(--blue); color:var(--text)}

.hero{padding:38px 0 18px}
.kicker{font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--blue-text); margin-bottom:6px}
h1{margin:0 0 10px; font-size:33px; line-height:1.18; letter-spacing:-.025em; max-width:24ch}
.sub{margin:0; color:var(--muted); font-size:16.5px; max-width:62ch}
.asof{margin-top:10px; color:var(--muted2); font-size:13px}

.panel{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; margin:18px 0 6px}
.row{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.lbl{display:block; font-size:12.5px; font-weight:700; color:var(--muted2); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px}

select,input[type=search]{width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; font-size:14.5px; min-height:42px}

details.more summary span{color:var(--muted2); font-weight:400; font-size:13px}
.more-grid{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:16px; margin-top:10px; align-items:end}
.chk{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text); min-height:42px; cursor:pointer}

.tune div{display:flex; gap:8px}
.btn{background:var(--blue-soft); border:1px solid var(--border-hover); color:var(--blue-text); border-radius:8px; padding:7px 14px; font-size:13.5px; font-weight:600; cursor:pointer; min-height:36px}
.btn:hover{border-color:var(--blue); color:var(--blue-bright)}

.btn.ghost{background:none; border-color:var(--border); color:var(--muted)}

.weights input{width:100%; accent-color:var(--blue)}

.bar{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin:30px 0 12px}
h2{margin:0; font-size:22px; letter-spacing:-.01em}

.card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--border-hover)}

.score small{display:block; font-size:11px; color:var(--muted2); margin-top:-4px}
.tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.03em; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.04); border:1px solid var(--border); color:var(--muted)}

.dots{display:flex; align-items:center; gap:3px}

.dots i.on{background:var(--blue-text)}
.dots.inv i.on{background:var(--yellow)}

.c-rev{font-size:13.5px; margin:0}

.c-live span{display:block; color:var(--muted2); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:700}
.c-live b{font-variant-numeric:tabular-nums}
.up{color:var(--green-text)} .down{color:var(--red)}

.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.tile{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; text-align:left; color:var(--text); cursor:pointer; display:flex; flex-direction:column; gap:4px; font-size:13px}
.tile:hover{border-color:var(--border-hover); background:var(--card-hover)}

.tile .t-v{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.tile .t-c{font-weight:700; font-variant-numeric:tabular-nums}
.tile .t-s{color:var(--muted2); font-size:12px}
.tile .t-n{color:var(--blue-text); font-size:12.5px; margin-top:2px}
.live-d{border-left:3px solid var(--blue); background:rgba(59,110,255,.06); border-radius:0 12px 12px 0; padding:12px 14px; margin-bottom:16px}

.live-d p{margin:4px 0 2px; font-size:14.5px}
.live-d em{display:block; font-style:normal; color:var(--muted2); font-size:12.5px}
.c-act{display:flex; gap:8px; margin-top:auto}

.empty{background:var(--card); border:1px dashed var(--border-hover); border-radius:16px; padding:22px; color:var(--muted); text-align:center}

.picks{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}

.picks button:disabled{opacity:.4; cursor:default}
.tscroll{overflow-x:auto; border:1px solid var(--border); border-radius:16px; background:var(--card)}
table.cmp{border-collapse:collapse; width:100%; min-width:640px; font-size:13.5px}
table.cmp th,table.cmp td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:top; text-align:left}
table.cmp thead th{font-size:15px}
table.cmp tbody th{color:var(--muted2); font-weight:600; width:160px; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em}
table.cmp td p{margin:4px 0 0; color:var(--muted)}
table.cmp tr:last-child th,table.cmp tr:last-child td{border-bottom:0}
.x{background:none; border:0; color:var(--muted2); cursor:pointer; font-size:12.5px; padding:4px 0}
.x:hover{color:var(--red)}
.links{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:13px}

.method{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px}
.method p{margin:0 0 10px; color:var(--muted); font-size:14.5px}
.method p strong{color:var(--text)}
.formula{background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin:0 0 12px; font-size:15px; font-weight:600}
.formula small{display:block; color:var(--muted); font-weight:400; font-size:13px; margin-top:2px}
.rubric{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin:12px 0}
.rubric div{border-left:3px solid var(--border-hover); padding-left:12px}
.rubric h4{margin:0 0 4px; font-size:14px}
.rubric p{font-size:13.5px; margin:0}
.srcs{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; margin-top:12px}
.src{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px}
.src span{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--muted2)}

.src p{margin:0 0 6px; font-size:13.5px; color:var(--muted)}
.src small{color:var(--muted2); font-size:12px}
.foot-note{margin-top:14px; border-left:3px solid var(--yellow); padding:4px 0 4px 14px; font-size:13.5px; color:var(--muted)}

dialog{background:var(--card); color:var(--text); border:1px solid var(--border-hover); border-radius:18px; padding:0; width:min(860px,calc(100vw - 24px)); max-height:calc(100vh - 40px)}

.d-in{padding:22px 24px 24px}
.d-top{display:flex; justify-content:space-between; gap:14px; align-items:flex-start}

.close:hover{color:var(--text); border-color:var(--border-hover)}
.d-lead{color:var(--muted); font-size:15px; margin:10px 0 14px}
.fact{border-left:3px solid var(--green); background:rgba(63,191,135,.06); border-radius:0 12px 12px 0; padding:12px 14px; margin-bottom:16px}
.fact small{color:var(--green-text); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em}
.fact p{margin:4px 0 6px; font-size:14.5px}
.d-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 22px}
.d-grid h4,.d-next h4{margin:0 0 4px; font-size:12.5px; color:var(--muted2); text-transform:uppercase; letter-spacing:.04em}
.d-grid p,.d-next p{margin:0; font-size:14.5px}
.d-next{margin-top:16px; background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:12px 14px}
.d-why{margin-top:14px; font-size:14px; color:var(--muted)}
.d-why summary{cursor:pointer; color:var(--blue-text); font-weight:600}
.d-act{margin-top:16px; display:flex; gap:10px; flex-wrap:wrap}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--blue-soft); border:1px solid var(--blue); color:var(--text); padding:10px 16px; border-radius:10px; font-size:14px; display:none; z-index:5}

@media (max-width:900px){
  .grid{grid-template-columns:1fr 1fr}
  .filters{grid-template-columns:1fr 1fr}
  .filters .q{grid-column:1/-1}
  .more-grid{grid-template-columns:1fr 1fr}

@media (max-width:640px){

  .head-links{display:none}
  .d-in{padding:18px 16px}
}

var KEYS = ['demand', 'money', 'ease', 'calm', 'visibility'];
var PRESETS = {
  balance:    { demand:30, money:25, ease:20, calm:10, visibility:15 },

  var sum = 0, acc = 0;
  KEYS.forEach(function(k){ sum += w[k]; acc += w[k] * v[k]; });
  return sum ? 20 * acc / sum : 0;
}

function uniq(fn){
  var seen = {}, out = [];
  DATA.niches.forEach(function(n){ [].concat(fn(n)).forEach(function(v){ if (!seen[v[0]]) { seen[v[0]] = 1; out.push(v); } }); });
  return out;
}

function ranked(list){
  var out = list.map(function(n){ return { n:n, p:score(n, w) }; });
  out.sort(function(a, b){
    var d = 0;
    if (sort === 'difficulty') d = a.n.difficulty - b.n.difficulty;
    else if (sort === 'competition') d = a.n.competition - b.n.competition;
    else if (sort === 'visibility') d = b.n.visibility - a.n.visibility;
    else if (sort === 'demand') d = b.n.demand - a.n.demand;
    return d || (b.p - a.p) || a.n.id.localeCompare(b.n.id);
  });
  return out;
}
function filtered(){
  var q = f.q.toLowerCase().trim();
  return DATA.niches.filter(function(n){
    var en = n.en, ru = n.ru;
    if (f.cat !== 'all' && en.category !== f.cat) return false;
    if (f.skills !== 'all' && n.skills !== f.skills) return false;
    if (n.difficulty > Number(f.diff)) return false;
    if (f.model !== 'all' && en.models.indexOf(f.model) < 0) return false;
    if (f.signal !== 'all' && en.signal !== f.signal) return false;
    if (f.nocon && n.contracts) return false;
    if (f.nocap && n.capital) return false;
    if (q) {
      var hay = [en.name, en.summary, en.buyer, en.mvp, en.wedge, en.category, en.models.join(' '), ru.name, ru.summary, ru.buyer, ru.mvp, ru.wedge, ru.category, ru.models.join(' ')].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function topIds(){
  return filtered().map(function(n){ return { id:n.id, p:score(n, w) }; })
    .sort(function(a, b){ return (b.p - a.p) || a.id.localeCompare(b.id); }).slice(0, 3).map(function(x){ return x.id; });
}

function num(v, d){ return v.toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US', { minimumFractionDigits:d, maximumFractionDigits:d }); }
function amount(m){
  var T = t(), v = m.value, a = Math.abs(v), s = a >= 1e9 ? num(v / 1e9, 2) + T.B : a >= 1e6 ? num(v / 1e6, 1) + T.M : a >= 1e3 ? num(v / 1e3, 0) + T.K : num(v, 0);
  return m.unit === 'usd' ? '$' + s : m.unit === 'eur' ? '€' + s : s;
}
function change(m){
  if (m.change == null) return '';
  var c = m.change, s = (c > 0 ? '+' : c < 0 ? '−' : '') + num(Math.abs(c), 1) + '%';
  return '<span class="' + (c > 0 ? 'up' : c < 0 ? 'down' : '') + '">' + s + '</span> ' + esc(t().week);
}
function proof(m){
  var T = t();

function paintPulse(){
  if (!LIVE || !DATA) return;

  $('pulse-note').textContent = T.pulseNote + ' ' + T.updated + ' ' + ago + '.';
  var list = LIVE.metrics.slice().sort(function(a, b){ return (b.change == null ? -1e9 : b.change) - (a.change == null ? -1e9 : a.change); });
  $('tiles').innerHTML = list.map(function(m){

      '<button class="close" type="button" data-close aria-label="Close">×</button></div></div>' +
    '<p class="d-lead">' + esc(l.summary) + '</p>' +
    '<div class="fact"><small>' + esc(T.verified) + '</small><p>' + esc(l.fact) + '</p>' + srcLinks(n.sources) + '</div>' +
    liveFor(id).map(function(m){
      return '<div class="live-d"><small>' + esc(T.liveD) + '</small><p>' + esc(m[lang]) + ': <b>' + esc(amount(m)) + '</b>' + (m.change != null ? ' · ' + change(m) : '') + '</p>' +
        '<em>' + esc(proof(m)) + ' · ' + esc(T.asOfL) + ' ' + esc(fmtDate(m.asOf.slice(0, 10))) + '</em></div>';
    }).join('') +
    '<div class="d-grid">' +
      [[T.buyer, l.buyer], [T.how, l.monetization], [T.first, l.mvp], [T.stand, l.wedge], [T.limits, l.risk], [T.existing, l.competitors]]
        .map(function(p){ return '<div><h4>' + esc(p[0]) + '</h4><p>' + esc(p[1]) + '</p></div>'; }).join('') +
    '</div>' +
    '<div class="d-next"><h4>' + esc(T.validate) + '</h4><p>' + esc(l.validation) + '</p></div>' +
    '<details class="d-why"><summary>' + esc(T.why) + '</summary><p>' + esc(l.reason) + '</p><p>' + esc(T.conf) + ': ' + esc(l.confidence.toLowerCase()) + '. ' + esc(l.paidDemand) + '. ' + esc(T.mvpNote) + '</p></details>' +
    '<div class="d-act"><button class="btn' + (on ? ' on' : '') + '" type="button" data-cmp="' + id + '"' + (!on && sel.length >= 4 ? ' disabled' : '') + '>' + esc(on ? T.added : T.add) + '</button></div>';
  var d = $('dlg');
  if (!d.open) { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
function closeIdea(){
  var d = $('dlg'); if (d.open) d.close();
  try { if (location.hash && location.hash.length > 1 && DATA.niches.some(function(n){ return '#' + n.id === location.hash; })) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}

function paintWeights(){
  var T = t(), sum = 0; KEYS.forEach(function(k){ sum += w[k]; });
  $('weights').innerHTML = KEYS.map(function(k){
    return '<label>' + esc(T.w[k]) + ' <b>' + Math.round(w[k] * 100 / sum) + '%</b><input type="range" min="0" max="100" step="5" value="' + w[k] + '" data-w="' + k + '"></label>';
  }).join('');
}
function paintGoal(){
  var T = t();
  $('goal').innerHTML = ['balance', 'income', 'visibility'].map(function(g){
    return '<button type="button" data-goal="' + g + '" class="' + (goal === g ? 'on' : '') + '">' + esc(T.presets[g]) + '</button>';
  }).join('') + (goal === 'custom' ? '<button type="button" class="on" disabled>' + esc(T.presets.custom) + '</button>' : '');
}
function paintMoreLabel(){
  var on = f.model !== 'all' || f.signal !== 'all' || f.nocon || f.nocap;
  $('t-more-sub').textContent = on ? t().moreOn : t().moreSub;
}

function paintStatic(){
  var T = t();
  document.documentElement.lang = lang;
  $('l-en').className = lang === 'en' ? 'on' : ''; $('l-ru').className = lang === 'ru' ? 'on' : '';
  ['nav1','nav2','nav3','kicker','title','sub','goal','skills','q','cat','diff','more','model','signal','nocon','nocap','ranked','all','legend','cmp','method','sources']
    .forEach(function(k){ var el = $('t-' + k); if (el) el.textContent = T[k]; });
  $('t-cmp-note').textContent = T.cmpNote;
  $('t-asof').textContent = T.asof + ': ' + fmtDate(DATA.snapshot);
  var ch = (DATA.changes || [])[0];
  $('t-changed').hidden = !ch;
  if (ch) $('t-changed').textContent = T.changed + ' (' + fmtDate(ch.date) + '): ' + ch[lang];
  $('f-q').placeholder = T.qPh; $('f-q').value = f.q;
  $('b-weights').textContent = T.weights + ($('weights').hidden ? ' +' : ' −');
  $('b-reset').textContent = T.reset; $('b-top').textContent = T.top; $('b-clear').textContent = T.clear;
  options($('f-skills'), [['all', T.allSkills]].concat(uniq(function(n){ return [[n.skills, L(n).skill]]; })), f.skills);
  options($('f-cat'), [['all', T.allCats]].concat(uniq(function(n){ return [[n.en.category, L(n).category]]; })), f.cat);
  options($('f-diff'), T.diffs, f.diff);
  options($('f-model'), [['all', T.allModels]].concat(uniq(function(n){ return n.en.models.map(function(m, i){ return [m, L(n).models[i]]; }); })), f.model);
  options($('f-signal'), [['all', T.anySignal]].concat(uniq(function(n){ return [[n.en.signal, L(n).signal]]; })), f.signal);
  $('f-nocon').checked = f.nocon; $('f-nocap').checked = f.nocap;
  options($('sort'), T.sorts, sort);
  paintGoal(); paintWeights(); paintMoreLabel();

  var u = DATA.niches.filter(function(n){ return n.id === 'usdc-ops'; })[0];
  $('method-body').innerHTML = '<p>' + T.m1 + '</p>' +
    '<div class="formula">' + esc(T.f1) + '<small>' + esc(T.f2) + '</small></div>' +
    '<p>' + esc(T.m2) + '</p>' +
    '<div class="rubric">' + DATA.metrics.map(function(m){ return '<div><h4>' + esc(m[lang].label) + '</h4><p>' + esc(m[lang].definition) + '</p></div>'; }).join('') + '</div>' +
    (u ? '<p>' + esc(T.ex) + '<br><strong>20 × (30×' + u.demand + ' + 25×' + u.money + ' + 20×' + (6 - u.difficulty) + ' + 10×' + (6 - u.competition) + ' + 15×' + u.visibility + ') / 100 = ' + Math.round(score(u, PRESETS.balance)) + ' ' + esc(T.points) + '</strong></p>' : '') +
    '<p>' + esc(T.m3) + '</p>';
  $('srcs').innerHTML = DATA.sources.map(function(s){
    var host = ''; try { host = new URL(s.url).hostname.replace(/^www\./, ''); } catch (e) {}
    return '<div class="src"><span>' + esc(s[lang].type) + '</span><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s[lang].title) + ' ↗</a><p>' + esc(s[lang].summary) + '</p><small>' + esc(T.checked) + ' ' + esc(fmtDate(s.checked)) + ' · ' + esc(host) + '</small></div>';
  }).join('');
  $('foot-note').innerHTML = '<p>' + esc(T.fn1) + '</p><p>' + esc(T.fn2) + '</p>' + srcLinks(['study', 'batches', 'codes']);
  $('t-foot').textContent = T.foot + ' ' + fmtDate(DATA.snapshot) + ' · ' + DATA.niches.length + ' ' + T.footN + ' · ' + DATA.sources.length + ' ' + T.footS + ' · ' + T.footTail;
  paintPulse(); paintGrid(); paintCompare();
  var d = $('dlg'); if (d.open && location.hash.length > 1) openIdea(location.hash.slice(1));
}

function toggle(id){
  var i = sel.indexOf(id);
  if (i >= 0) sel.splice(i, 1);
  else if (sel.length >= 4) { toast(t().max4); return; }
  else sel.push(id);
  paintGrid(); paintCompare();
  if ($('dlg').open) openIdea(id);
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-open],[data-cmp],[data-goal],[data-close],[data-reset]');
  if (!el) return;
  if (el.hasAttribute('data-open')) openIdea(el.getAttribute('data-open'));
  else if (el.hasAttribute('data-cmp')) toggle(el.getAttribute('data-cmp'));
  else if (el.hasAttribute('data-close')) closeIdea();
  else if (el.hasAttribute('data-reset')) { f = Object.assign({}, DEF); paintStatic(); }
  else if (el.hasAttribute('data-goal')) { goal = el.getAttribute('data-goal'); w = Object.assign({}, PRESETS[goal]); paintGoal(); paintWeights(); paintGrid(); paintCompare(); }
});
$('dlg').addEventListener('click', function(e){ if (e.target === this) closeIdea(); });
$('dlg').addEventListener('close', function(){ closeIdea(); });
$('weights').addEventListener('input', function(e){
  var k = e.target.getAttribute('data-w'); if (!k) return;
  var v = Number(e.target.value), others = KEYS.some(function(x){ return x !== k && w[x] > 0; });
  if (!v && !others) { e.target.value = w[k]; toast(t().keepOne); return; }
  w[k] = v; goal = 'custom';
  var sum = 0; KEYS.forEach(function(x){ sum += w[x]; });
  [].forEach.call(this.querySelectorAll('label'), function(lb){ var kk = lb.querySelector('input').getAttribute('data-w'); lb.querySelector('b').textContent = Math.round(w[kk] * 100 / sum) + '%'; });
  paintGoal(); paintGrid(); paintCompare();
});
function bindSel(id, key){ $(id).addEventListener('change', function(){ f[key] = this.type === 'checkbox' ? this.checked : this.value; paintMoreLabel(); paintGrid(); }); }
bindSel('f-skills', 'skills'); bindSel('f-cat', 'cat'); bindSel('f-diff', 'diff'); bindSel('f-model', 'model'); bindSel('f-signal', 'signal'); bindSel('f-nocon', 'nocon'); bindSel('f-nocap', 'nocap');
$('f-q').addEventListener('input', function(){ f.q = this.value; paintGrid(); });
$('sort').addEventListener('change', function(){ sort = this.value; paintGrid(); });
$('b-weights').addEventListener('click', function(){ $('weights').hidden = !$('weights').hidden; this.textContent = t().weights + ($('weights').hidden ? ' +' : ' −'); });
$('b-reset').addEventListener('click', function(){ f = Object.assign({}, DEF); paintStatic(); });
$('b-top').addEventListener('click', function(){ sel = topIds(); paintGrid(); paintCompare(); toast(t().topAdded); });
$('b-clear').addEventListener('click', function(){ sel = []; paintGrid(); paintCompare(); });
function setLang(l){ lang = l; store('ck-lang', l); paintStatic(); }
$('l-en').onclick = function(){ setLang('en'); };
$('l-ru').onclick = function(){ setLang('ru'); };

fetch('/navigator-data.json').then(function(r){ return r.json(); }).then(function(d){
  DATA = d;
  var ids = DATA.niches.map(function(n){ return n.id; });
  sel = sel.filter(function(id){ return ids.indexOf(id) >= 0; });
  paintStatic();
  if (location.hash.length > 1 && ids.indexOf(location.hash.slice(1)) >= 0) openIdea(location.hash.slice(1));
}).catch(function(){
  $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">Could not load the niches. Reload the page.</div>';
});
// Without the live file the page is the same as before: scores and sources, no live numbers.
fetch(LIVE_URL, { cache:'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
  if (!d || !d.metrics) return;
  LIVE = d;
  if (DATA) { paintPulse(); paintGrid(); }
}).catch(function(){});
})();
</script>
