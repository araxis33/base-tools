      r.appendChild(el('h3', null, t.raises));
      var u2 = el('ul', 'find');
      a.down.forEach(function (f) { u2.appendChild(el('li', null, '✅ ' + say(f))); });
      r.appendChild(u2);
    }
    if (a.rights.length) {
      var rc = card(t.rightsTitle, 'rights'); line(rc, t.rightsNote, 'note');
      a.rights.forEach(function (f) { line(rc, '• ' + say(f)); }); r.appendChild(rc);
    }

    var ageTxt = d.ageH >= 48 ? Math.round(d.ageH / 24) + (ru ? ' дн.' : ' days') : Math.round(d.ageH || 0) + (ru ? ' ч' : ' h');
    var m = card(t.market);
    line(m, (ru ? 'Капа ' : 'Market cap ') + usd(d.mcap) + (ru ? ' · ликвидность ' : ' · liquidity ') + usd(d.liq) + (ru ? ' · объём за сутки ' : ' · 24h volume ') + usd(d.vol));
    line(m, (ru ? 'Возраст ' : 'Age ') + ageTxt + (ru ? ' · пулов ' : ' · pools ') + d.pools + (ru ? ' · держателей ' : ' · holders ') + (d.holderCount ? d.holderCount.toLocaleString(ru ? 'ru-RU' : 'en-US') : '?'));
    if (d.buyers !== null) line(m, (ru ? 'За сутки: ' : '24h: ') + d.buyers + (ru ? ' покупателей, ' : ' buyers, ') + d.sellers + (ru ? ' продавцов' : ' sellers'));
    else line(m, (ru ? 'За сутки: ' : '24h: ') + d.dsBuys + (ru ? ' покупок, ' : ' buys, ') + d.dsSells + (ru ? ' продаж' : ' sells'));
    var trapSale = a.hard.some(function (f) { return f[0] === 'honeypot'; });
    if (Object.keys(d.exits).length) {
      if (trapSale) line(m, ru ? 'Маршрут обмена обещает выкуп, но симуляция продажи падает — этим цифрам не верь' : 'The swap route quotes a price, but the sell simulation fails — do not trust these numbers');
      else line(m, (ru ? 'Продать сейчас: ' : 'Sell now: ') + Object.keys(d.exits).map(function (k) { return '$' + Number(k).toLocaleString('en-US') + ' → $' + Math.round(d.exits[k][1]).toLocaleString('en-US'); }).join(' · '));
    }
    r.appendChild(m);

    var c = card(t.contract); checklist(d, a).forEach(function (s) { line(c, s); }); r.appendChild(c);

    var w = card(t.who), dv = d.dev || {};
    if (dv.dev) {
      line(w, (ru ? 'Автор ' : 'Deployer ') + CK.short(dv.dev));
      if (dv.funder) {
        var mins = dv.fundedBeforeMin, when = '';
        if (mins !== null && mins !== undefined) when = mins < 120 ? (ru ? ', за ' + Math.round(mins) + ' мин до запуска' : ', ' + Math.round(mins) + ' min before launch') : mins < 2880 ? (ru ? ', за ' + Math.round(mins / 60) + ' ч до запуска' : ', ' + Math.round(mins / 60) + ' h before launch') : (ru ? ', за ' + Math.round(mins / 1440) + ' дн. до запуска' : ', ' + Math.round(mins / 1440) + ' days before launch');
        line(w, (ru ? 'Первые деньги: ' : 'First money from: ') + CK.short(dv.funder) + (dv.funderLabel ? ' (' + (dv.funderLabel === 'exchange' ? (ru ? 'биржа или мост' : 'exchange or bridge') : dv.funderLabel) + ')' : '') + (dv.funderAmount ? ' ' + dv.funderAmount.toFixed(4) + ' ETH' : '') + when);
      }
      if (dv.devHistoryComplete === false && !dv.funder) line(w, ru ? 'Кошелёк давний и активный: больше ' + (dv.devTxCount || 150) + ' операций — не одноразовый' : 'An old, active wallet: more than ' + (dv.devTxCount || 150) + ' transactions — not a burner');
      var L = dv.launches || [];
      if (L.length) { var alive = L.filter(function (l) { return l.liq >= 1000; }); line(w, (ru ? 'Другие его монеты: ' : 'His other coins: ') + L.length + (ru ? ', живы ' : ', alive ') + alive.length + (alive.length ? ' (' + alive.sort(function (x, y) { return y.liq - x.liq; }).slice(0, 4).map(function (l) { return l.symbol + ' ' + usd(l.liq); }).join(', ') + ')' : '')); }
      else line(w, ru ? 'Других запусков с этого кошелька не видно' : 'No other launches from this wallet');
    } else line(w, ru ? 'Автора определить не удалось' : 'Could not identify the deployer');
    r.appendChild(w);

    var h = card(t.holders);
    d.holders.rows.slice(0, 6).forEach(function (row) {
      var tag = { pool: ru ? 'пул' : 'pool', burn: ru ? 'сожжено' : 'burned', contract: ru ? 'контракт' : 'contract' }[row.kind] || '';
      if (row.kind === 'contract' && row.name) tag += ' ' + row.name;
      if (row.isDev) tag = ru ? 'автор' : 'deployer';
      else if (row.gotFrom && row.gotFrom === dv.dev) tag = row.exchange ? (ru ? 'биржа, получила от автора' : 'exchange, got it from the deployer') : (ru ? 'получил от автора' : 'got it from the deployer');
      else if (row.exchange) tag = ru ? 'биржа' : 'exchange';
      else if (row.gotFrom === 'pool') tag = ru ? 'купил' : 'bought';
      line(h, pct(row.pct) + '  ' + CK.short(row.address) + '  ' + tag);
    });
    d.holders.clusters.slice(0, 2).forEach(function (cl) { line(h, '🔗 ' + (ru ? 'кошельков с деньгами от ' : 'wallets funded by ') + CK.short(cl[0]) + ': ' + cl[1].length + (ru ? ', вместе ' : ', together ') + p0(cl[1].reduce(function (s, x) { return s + x.pct; }, 0))); });
    r.appendChild(h);

    var p = card(t.project, 'proj');
    if (project === undefined) line(p, t.projWait, 'note');
    else if (!project) line(p, t.projOff, 'note');
    else {
      line(p, project.text);
      if (project.sources && project.sources.length) {
        var src = el('p', 'note'); src.appendChild(document.createTextNode(ru ? 'Источники: ' : 'Sources: '));
        project.sources.forEach(function (s, i) { var aEl = el('a', null, '[' + s.n + ']'); aEl.href = s.url; aEl.target = '_blank'; aEl.rel = 'noopener nofollow'; if (i) src.appendChild(document.createTextNode(' · ')); src.appendChild(aEl); });
        p.appendChild(src);
      }
      if (project.note) line(p, project.note, 'note');
    }
    r.appendChild(p);

    var sh = el('button', 'share', t.share); sh.type = 'button';
    sh.onclick = function () {
      var link = location.origin + location.pathname + '?a=' + d.address;
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { sh.textContent = t.copied; }, function () { window.prompt('', link); });
    };
    r.appendChild(sh);
    r.appendChild(el('p', 'note', t.base));
    if (d.url) { var links = el('p', 'note'); var g = el('a', null, ru ? 'График' : 'Chart'); g.href = d.url; g.target = '_blank'; g.rel = 'noopener'; links.appendChild(g); r.appendChild(links); }
    out.appendChild(r);
  }

  function facts(d, a) {
    return { symbol: d.symbol, name: d.name, chain: d.chain, address: d.address, websites: d.websites, socials: d.socials,
      trust: a.trust, verdict: 'TRUST ' + a.trust + '/10', stop: a.hard.map(sayEn), warn: a.up.map(sayEn), good: a.down.map(sayEn), rights: a.rights.map(sayEn),
      mcap: d.mcap, liq: d.liq, vol: d.vol, ageH: d.ageH, buyers: d.buyers, sellers: d.sellers, dsBuys: d.dsBuys, dsSells: d.dsSells,
      cg: { name: d.cg.name, id: d.cg.id, updated: d.cg.updated, categories: d.cg.categories, genesis: d.cg.genesis,
        description: d.cg.description, homepage: d.cg.homepage, repos: d.cg.repos, cex: (d.cg.cex || []).length } };
  }

  function run() {
    var m = CK.ADDR_RE.exec($('addr').value || '');
    $('out').innerHTML = '';
    if (!m) { $('out').appendChild(el('div', 'err', T[lang].badAddr)); return; }
    $('go').disabled = true;
    takeTicket().then(function (ticket) {
      paintStatic();
      if (!ticket) { $('go').disabled = false; showPay(); return; }
      CK.collect(m[0], showStep).then(function (d) {
        if (d.error) { $('steps').innerHTML = ''; last = null; render(d); $('go').disabled = false; return; }
        var a = CK.assess(d);
        last = { d: d, a: a, project: undefined };
        showStep('project'); render(d, a, undefined);
        var proj = ticket === 'local' ? Promise.resolve(null) :
          fetch(WORKER + '/read', { method: 'POST', headers: hdr({ 'content-type': 'application/json' }), body: JSON.stringify({ ticket: ticket, lang: lang, facts: facts(d, a) }) })
            .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
        proj.then(function (pr) {
          last.project = pr && pr.text ? pr : null;
          $('steps').innerHTML = ''; render(d, a, last.project); $('go').disabled = false;
        });
      }).catch(function (e) {
        $('steps').innerHTML = ''; $('out').appendChild(el('div', 'err', String(e && e.message || e))); $('go').disabled = false;
      });
    });
  }
  $('f').onsubmit = function (ev) { ev.preventDefault(); run(); };

  if (params.get('a')) $('addr').value = params.get('a');
  paintStatic();
  refreshQuota().then(function () { if (params.get('a') && params.get('go') === '1') run(); });
})();
</script>
