name: test

on:
  push:
    branches: [main]
    paths-ignore:
      # The meme-scout bot commits this file many times a day.
      - scout-stats.json
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
